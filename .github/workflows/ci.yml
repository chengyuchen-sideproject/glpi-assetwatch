name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: Lint + unit tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["7.4", "8.0", "8.1", "8.2", "8.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, json
          coverage: none
      - name: Syntax check
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l > /dev/null
      - name: PHPUnit
        run: |
          curl -sSL -o phpunit.phar https://phar.phpunit.de/phpunit-9.6.phar
          php phpunit.phar

  i18n:
    name: Translations up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every string translated, .mo files compiled
        run: |
          python3 tools/i18n.py check
          python3 tools/i18n.py compile
          git diff --exit-code -- locales/

  e2e:
    name: End-to-end on GLPI 10.0.20 (docker)
    runs-on: ubuntu-latest
    needs: [unit, i18n]
    steps:
      - uses: actions/checkout@v4
      - name: Start GLPI stack and install plugin
        run: bash dev/up.sh
      - name: Run scenarios
        run: PYTHON=python3 bash dev/scenarios.sh
      - name: GLPI logs on failure
        if: failure()
        run: |
          docker compose -f dev/docker-compose.yml logs glpi | tail -100
          docker compose -f dev/docker-compose.yml exec -T glpi sh -c 'tail -n 100 /var/glpi/logs/*.log' || true
